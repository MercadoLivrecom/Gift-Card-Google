<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - GiftCardSale</title>
  <meta name="description" content="Complete your purchase at GiftCardSale">
  
  <link rel="icon" type="image/webp" href="fasvcom.webp">
  
  <style>
    :root {
      --primary: #EA1D2C;
      --primary-dark: #C41826;
      --success: #38B03F;
      --bg: #F7F7F7;
      --card: #FFFFFF;
      --text: #212225;
      --text-light: #767676;
      --radius: 12px;
      --usd-highlight: #22c55e;
      --brl-highlight: #0d9488;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER SIMPLES */
    .checkout-header {
      background: var(--card);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-bottom: 1px solid #eee;
      height: 60px;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #f0f0f0; }
    .back-btn svg { width: 24px; height: 24px; }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .header-logo svg { width: 28px; height: 28px; color: var(--primary); }
    .header-logo h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }
    .header-logo h1 span { color: var(--primary); }

    /* CONTAINER PRINCIPAL */
    .checkout-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px;
      padding-bottom: 100px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title svg { width: 24px; height: 24px; color: var(--primary); }

    /* FORMULÁRIO */
    .form-section {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #eee;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group:last-child { margin-bottom: 0; }
    
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
      background: #f9fafb;
    }
    .form-input:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(234,29,44,0.1);
    }
    .form-input:disabled {
      background: #f0f0f0;
      color: var(--text-light);
    }

    .phone-input-wrapper {
      display: flex;
      gap: 10px;
    }
    .country-code-select {
      width: 100px;
      padding: 14px 12px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 0.9rem;
      background: #f9fafb;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
      font-weight: 600;
    }
    .country-code-select:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(234,29,44,0.1);
    }

    /* ITENS DO PEDIDO */
    .order-section {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #eee;
    }

    .order-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px dashed #eee;
    }
    .order-item:last-child { border-bottom: none; }

    .order-item-img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: contain;
      background: #f9fafb;
      padding: 8px;
      flex-shrink: 0;
    }

    .order-item-info { flex: 1; }
    .order-item-name {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .order-item-detail {
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .order-item-price {
      text-align: right;
      flex-shrink: 0;
    }
    .order-item-total {
      font-weight: 700;
      font-size: 1rem;
      color: var(--usd-highlight);
    }
    .order-item-qty {
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .order-divider {
      height: 2px;
      background: #eee;
      margin: 16px 0;
    }

    .order-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .order-total-label {
      font-size: 0.9rem;
      color: var(--text-light);
    }
    .order-total-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--success);
    }

    /* ✅ BOTÃO FLUTUANTE DO CARRINHO ✅ */
    .floating-checkout {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 16px 32px;
      border-radius: 50px;
      box-shadow: 0 8px 32px rgba(234,29,44,0.4);
      cursor: pointer;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      width: 90%;
      max-width: 400px;
    }
    .floating-checkout:hover {
      transform: translateX(-50%) translateY(-4px);
      box-shadow: 0 12px 40px rgba(234,29,44,0.5);
    }
    .floating-checkout:active {
      transform: translateX(-50%) translateY(0);
    }
    .floating-checkout svg {
      width: 24px;
      height: 24px;
    }
    .floating-total {
      font-size: 1.2rem;
      font-weight: 800;
    }

    /* RODAPÉ SIMPLES */
    .checkout-footer {
      text-align: center;
      padding: 20px 16px;
      background: var(--card);
      border-top: 1px solid #eee;
      margin-top: 20px;
    }
    .checkout-footer p {
      font-size: 0.75rem;
      color: var(--text-light);
      margin: 0;
    }
    .checkout-footer a {
      color: var(--primary);
      text-decoration: none;
    }

    /* TOAST */
    .toast-container {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: white;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 300px;
      animation: slideIn 0.3s ease;
      pointer-events: auto;
      border-left: 4px solid var(--success);
    }
    .toast.error { border-left-color: var(--primary); }
    .toast.success { border-left-color: var(--success); }
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(400px); opacity: 0; }
    }
    .toast.hiding { animation: slideOut 0.3s ease forwards; }
    .toast-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .toast.success .toast-icon { background: #d4edda; color: var(--success); }
    .toast.error .toast-icon { background: #f8d7da; color: var(--primary); }
    .toast-icon svg { width: 16px; height: 16px; }
    .toast-content { flex: 1; }
    .toast-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; }
    .toast-message { font-size: 0.85rem; color: var(--text-light); }

    /* LOADING */
    .btn-loading {
      position: relative;
      color: transparent !important;
      pointer-events: none;
    }
    .btn-loading::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .checkout-container { padding: 16px 12px; padding-bottom: 90px; }
      .form-section, .order-section { padding: 20px 16px; }
      .toast { min-width: 260px; }
      .floating-checkout {
        bottom: 16px;
        padding: 14px 24px;
        width: 95%;
      }
    }
  </style>
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <!-- HEADER SIMPLES - SEM BUSCA, PERFIL, CARRINHO -->
  <header class="checkout-header">
    <button class="back-btn" onclick="window.history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="header-logo" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      <!-- ✅ LOGO NÃO TRADUZÍVEL ✅ -->
      <h1 class="notranslate" translate="no">giftcard<span>sale</span></h1>
    </div>
  </header>

  <div class="checkout-container">
    
    <!-- TÍTULO -->
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
        <line x1="1" y1="10" x2="23" y2="10"/>
      </svg>
      Checkout
    </div>

    <!-- FORMULÁRIO DE DADOS -->
    <div class="form-section">
      <h3 style="font-size: 1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;color:var(--primary)">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Your Information
      </h3>
      
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="checkName" class="form-input" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="checkEmail" class="form-input" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <div class="phone-input-wrapper">
          <select id="checkCountryCode" class="country-code-select">
            <!-- ✅ BANDEIRAS CORRETAS ✅ -->
            <option value="+1">🇺🇸 +1</option>
            <option value="+55">🇧🇷 +55</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+34">🇪🇸 +34</option>
            <option value="+33">🇫🇷 +33</option>
            <option value="+49">🇩🇪 +49</option>
            <option value="+39">🇮🇹 +39</option>
            <option value="+81">🇯🇵 +81</option>
            <option value="+86">🇨🇳 +86</option>
            <option value="+91">🇮🇳 +91</option>
          </select>
          <input type="tel" id="checkPhone" class="form-input" placeholder="(000) 000-0000" maxlength="14">
        </div>
      </div>
    </div>

    <!-- ITENS DO PEDIDO -->
    <div class="order-section">
      <h3 style="font-size: 1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;color:var(--primary)">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Order Summary
      </h3>
      
      <div id="orderItems"></div>
      
      <div class="order-divider"></div>
      
      <div class="order-total-row">
        <span class="order-total-label">Total to Pay:</span>
        <span class="order-total-value" id="orderTotal">$0.00</span>
      </div>
    </div>

  </div>

  <!-- ✅ BOTÃO FLUTUANTE COM TOTAL ✅ -->
  <button class="floating-checkout" id="floatingCheckout" onclick="finalizeCheckout()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
      <line x1="1" y1="10" x2="23" y2="10"/>
    </svg>
    <span class="floating-total" id="floatingTotal">$0.00</span>
  </button>

  <!-- RODAPÉ SIMPLES -->
  <footer class="checkout-footer">
    <p>© 2026 <a href="https://www.giftcardsale.shop">giftcardsale.shop</a> - All Rights Reserved</p>
    <p style="margin-top: 4px; font-size: 0.7rem;">🔒 Secure checkout • Instant delivery</p>
  </footer>

  <script>
    let cartItems = [];
    let currencySymbol = '$';
    let countryCode = 'US';

    // ✅ MAPEAMENTO DE IMAGENS POR ID DO PRODUTO ✅
    const productImages = {
      'googleplay-20': 'Goo.webp', 'googleplay-50': 'Goo.webp', 'googleplay-100': 'Goo.webp', 'googleplay-150': 'Goo.webp',
      'apple-20': 'Apple.webp', 'apple-50': 'Apple.webp', 'apple-100': 'Apple.webp', 'apple-200': 'Apple.webp',
      'steam-20': 'steam.webp', 'steam-50': 'steam.webp', 'steam-100': 'steam.webp', 'steam-200': 'steam.webp',
      'roblox-20': 'Roblox.webp', 'roblox-50': 'Roblox.webp', 'roblox-100': 'Roblox.webp', 'roblox-200': 'Roblox.webp',
      'xbox-20': 'Xbox.webp', 'xbox-50': 'Xbox.webp', 'xbox-100': 'Xbox.webp', 'xbox-200': 'Xbox.webp',
      'paypal-20': 'PayPal.webp', 'paypal-50': 'PayPal.webp', 'paypal-100': 'PayPal.webp', 'paypal-200': 'PayPal.webp',
      'netflix-basic': 'Netflix1.webp', 'netflix-standard': 'Netflix1.webp', 'netflix-premium': 'Netflix1.webp', 'netflix-150': 'Netflix1.webp'
    };

    document.addEventListener('DOMContentLoaded', function() {
      loadCartFromURL();
      loadUserInfoFromURL();
      setupPhoneFormatting();
      updateFloatingButton();
    });

    // ✅ CARREGA ITENS DO CARRINHO DA URL ✅
    function loadCartFromURL() {
      const params = new URLSearchParams(window.location.search);
      const itemsParam = params.get('items');
      const totalParam = params.get('total');
      const countryParam = params.get('country');

      if (countryParam) {
        countryCode = countryParam;
        currencySymbol = countryParam === 'US' ? '$' : 'R$';
      }

      if (itemsParam) {
        try {
          const parsedItems = JSON.parse(atob(itemsParam));
          cartItems = parsedItems.map(item => ({
            ...item,
            img: productImages[item.id] || 'https://via.placeholder.com/60x60?text=Card'
          }));
        } catch (e) { cartItems = []; }
      }

      renderOrderItems();
      const total = totalParam ? parseFloat(totalParam) : cartItems.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('orderTotal').textContent = `${currencySymbol}${total.toFixed(2)}`;
      updateFloatingButton();
    }

    // ✅ CARREGA DADOS DO USUÁRIO DA URL ✅
    function loadUserInfoFromURL() {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name');
      const email = params.get('email');
      const phone = params.get('phone');

      const nameInput = document.getElementById('checkName');
      const emailInput = document.getElementById('checkEmail');
      const phoneInput = document.getElementById('checkPhone');

      if (name && email) {
        nameInput.value = decodeURIComponent(name);
        nameInput.disabled = true;
        nameInput.style.background = '#f0f0f0';
        nameInput.style.cursor = 'default';

        emailInput.value = decodeURIComponent(email);
        emailInput.disabled = true;
        emailInput.style.background = '#f0f0f0';
        emailInput.style.cursor = 'default';

        if (phone) {
          const decodedPhone = decodeURIComponent(phone);
          const phoneParts = decodedPhone.split(' ');
          if (phoneParts.length >= 2) {
            document.getElementById('checkCountryCode').value = phoneParts[0];
            const phoneNum = phoneParts.slice(1).join(' ').replace(/\D/g, '');
            let formatted = '';
            if (phoneNum.length <= 3) formatted = phoneNum;
            else if (phoneNum.length <= 6) formatted = `(${phoneNum.slice(0, 3)}) ${phoneNum.slice(3)}`;
            else formatted = `(${phoneNum.slice(0, 3)}) ${phoneNum.slice(3, 6)}-${phoneNum.slice(6)}`;
            phoneInput.value = formatted;
          }
        }

        phoneInput.disabled = true;
        phoneInput.style.background = '#f0f0f0';
        phoneInput.style.cursor = 'default';
        document.getElementById('checkCountryCode').disabled = true;
        document.getElementById('checkCountryCode').style.background = '#f0f0f0';
        document.getElementById('checkCountryCode').style.cursor = 'default';
      } else {
        nameInput.disabled = false;
        emailInput.disabled = false;
        phoneInput.disabled = false;
        document.getElementById('checkCountryCode').disabled = false;
      }
    }

    // ✅ RENDERIZA ITENS DO PEDIDO ✅
    function renderOrderItems() {
      const container = document.getElementById('orderItems');
      
      if (cartItems.length === 0) {
        container.innerHTML = `
          <div style="text-align:center;padding:30px;color:var(--text-light);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;margin-bottom:12px;opacity:0.3;">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <p>No items in your cart</p>
            <a href="index.html" style="color:var(--primary);text-decoration:none;font-weight:600;margin-top:8px;display:inline-block;">← Back to shop</a>
          </div>
        `;
        return;
      }

      container.innerHTML = cartItems.map(item => {
        const itemTotal = item.price * item.qty;
        return `
          <div class="order-item">
            <img class="order-item-img" src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/60x60?text=Card'">
            <div class="order-item-info">
              <div class="order-item-name">${item.name || 'Gift Card'}</div>
              <div class="order-item-detail">Qty: ${item.qty} × ${currencySymbol}${item.price.toFixed(2)}</div>
            </div>
            <div class="order-item-price">
              <div class="order-item-total">${currencySymbol}${itemTotal.toFixed(2)}</div>
              <div class="order-item-qty">x${item.qty}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ✅ FORMATAÇÃO DO TELEFONE ✅
    function setupPhoneFormatting() {
      const phoneInput = document.getElementById('checkPhone');
      phoneInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 10) value = value.slice(0, 10);
        let formatted = '';
        if (value.length > 0) {
          if (value.length <= 3) formatted = value;
          else if (value.length <= 6) formatted = `(${value.slice(0, 3)}) ${value.slice(3)}`;
          else formatted = `(${value.slice(0, 3)}) ${value.slice(3, 6)}-${value.slice(6)}`;
        }
        e.target.value = formatted;
      });
    }

    // ✅ ATUALIZAR BOTÃO FLUTUANTE ✅
    function updateFloatingButton() {
      const floatingBtn = document.getElementById('floatingCheckout');
      const floatingTotal = document.getElementById('floatingTotal');
      const total = cartItems.reduce((sum, i) => sum + (i.price * i.qty), 0);
      
      if (cartItems.length > 0) {
        floatingBtn.style.display = 'flex';
        floatingTotal.textContent = `${currencySymbol}${total.toFixed(2)}`;
      } else {
        floatingBtn.style.display = 'none';
      }
    }

    // ✅ FINALIZAR CHECKOUT ✅
    function finalizeCheckout() {
      const name = document.getElementById('checkName').value.trim();
      const email = document.getElementById('checkEmail').value.trim();
      const phoneCode = document.getElementById('checkCountryCode').value;
      const phone = document.getElementById('checkPhone').value.trim();

      if (cartItems.length === 0) { showToast('Your cart is empty!', 'error'); return; }
      if (!name) { showToast('Please enter your name.', 'error'); document.getElementById('checkName').focus(); return; }
      if (!email || !email.includes('@')) { showToast('Please enter a valid email.', 'error'); document.getElementById('checkEmail').focus(); return; }
      if (!phone || phone.replace(/\D/g, '').length < 7) { showToast('Please enter a valid phone number.', 'error'); document.getElementById('checkPhone').focus(); return; }

      const btn = document.getElementById('floatingCheckout');
      btn.classList.add('btn-loading');
      btn.innerHTML = '<span style="color:transparent">Processing...</span>';

      const total = cartItems.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const fullPhone = `${phoneCode} ${phone}`;

      const checkoutData = {
        name: encodeURIComponent(name),
        email: encodeURIComponent(email),
        phone: encodeURIComponent(fullPhone),
        items: btoa(JSON.stringify(cartItems)),
        total: total.toFixed(2),
        country: countryCode
      };

      const paymentURL = `payment.html?name=${checkoutData.name}&email=${checkoutData.email}&phone=${checkoutData.phone}&items=${checkoutData.items}&total=${checkoutData.total}&country=${checkoutData.country}`;

      setTimeout(() => {
        btn.classList.remove('btn-loading');
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:22px;height:22px"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg><span class="floating-total">${currencySymbol}${total.toFixed(2)}</span>`;
        showToast('Redirecting to payment...', 'success');
        setTimeout(() => { window.location.href = paymentURL; }, 1000);
      }, 1500);
    }

    // ✅ TOAST NOTIFICATIONS ✅
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success' 
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      const title = type === 'success' ? 'Success!' : 'Error';
      toast.innerHTML = `<div class="toast-icon">${icon}</div><div class="toast-content"><div class="toast-title">${title}</div><div class="toast-message">${message}</div></div>`;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.add('hiding'); toast.addEventListener('animationend', () => toast.remove()); }, 3000);
    }
  </script>

</body>
</html>
