<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERADOR MISTER</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --panel: #ffffff;
            --text: #222;
            --text-muted: #666;
            --gold: #d4af37;
            --gold-dark: #b8962e;
            --border: #ddd;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }

        /* HEADER */
        header { display: flex; align-items: center; background: #000; padding: 15px 20px; }
        .icon-btn { width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .icon-btn svg { width: 100%; height: 100%; fill: #888; }
        .icon-btn:hover svg { fill: #fff; }
        .header-title { flex: 1; margin-left: 15px; font-size: 20px; font-weight: 800; text-transform: uppercase; background: linear-gradient(90deg, #c00 50%, var(--gold) 50%); -webkit-background-clip: text; color: transparent; transform: skew(-3deg); }
        .header-settings { margin-left: auto; }

        /* SIDEBAR */
        .sidebar { position: fixed; top: 0; left: 0; width: 250px; height: 100%; background: #000; transform: translateX(-100%); transition: 0.3s; z-index: 1000; padding: 20px; }
        .sidebar.open { transform: translateX(0); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 999; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .sidebar a { display: block; padding: 15px 0; color: #fff; text-decoration: none; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; }
        .sidebar a svg { width: 20px; height: 20px; fill: #888; }
        .sidebar a:hover svg { fill: var(--gold); }

        /* MAIN CONTENT */
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px 100px; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
        .input-group label svg { width: 14px; height: 14px; fill: var(--gold); }
        
        .input-wrapper { position: relative; }
        .input-wrapper svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: #999; pointer-events: none; }
        
        input, select { width: 100%; padding: 12px 12px 12px 40px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: var(--gold); }
        
        /* DATE ROW (SIDE BY SIDE) */
        .date-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .date-col { flex: 1; }
        .date-col input, .date-col select { padding-left: 12px; } /* Remove icon space */

        /* TOGGLES */
        .toggle-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .toggle-btn { flex: 1; padding: 10px; border: 1px solid var(--border); background: #fff; border-radius: 6px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .toggle-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }

        /* BUTTON & PROGRESS */
        .btn-generate { width: 100%; padding: 14px; background: var(--gold); color: #000; border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-generate:hover { background: var(--gold-dark); }
        
        .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; margin: 15px 0; overflow: hidden; display: none; }
        .progress-fill { height: 100%; width: 0%; background: var(--gold); transition: width 0.2s; }
        
        .status-msg { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 10px; min-height: 15px; }
        .error { color: #c00; }

        /* OUTPUT */
        .output-box { background: #111; border-radius: 8px; padding: 15px; position: relative; display: none; max-height: 300px; overflow-y: auto; }
        .output-box.active { display: block; }
        .output-content { color: #e0e0e0; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
        .copy-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.1); border: none; border-radius: 4px; padding: 5px; cursor: pointer; }
        .copy-btn svg { width: 16px; height: 16px; fill: #fff; }

        /* WHATSAPP */
        .whatsapp-float { position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .whatsapp-float svg { width: 30px; height: 30px; fill: #fff; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <a href="1.html"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8l8 5 8-5v10z"/></svg>Comprar projetos</a>
        <a href="2.html"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>Contatos oficial</a>
        <a href="3.html"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Criador</a>
    </aside>

    <header>
        <div class="icon-btn" id="menuBtn"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>
        <div class="header-title">GERADOR MISTER</div>
        <div class="icon-btn header-settings" onclick="location.href='config.html'"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></div>
    </header>

    <div class="container">
        <!-- BIN -->
        <div class="input-group">
            <label><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6z"/></svg>BIN (6 a 9 dígitos)</label>
            <div class="input-wrapper"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2z"/></svg><input type="number" id="binInput" placeholder="Ex: 509050" maxlength="9"></div>
        </div>

        <!-- DATE ROW -->
        <div class="date-row">
            <div class="date-col input-group">
                <label style="justify-content:center;"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .89-2 2v14c0 1.11.89 2 2 2h14c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 16H5V8h14v11z"/></svg>Mês</label>
                <select id="monthSelect">
                    <option value="">Selecione</option>
                    <option value="01">01 - Jan</option><option value="02">02 - Fev</option><option value="03">03 - Mar</option>
                    <option value="04">04 - Abr</option><option value="05">05 - Mai</option><option value="06">06 - Jun</option>
                    <option value="07">07 - Jul</option><option value="08">08 - Ago</option><option value="09">09 - Set</option>
                    <option value="10">10 - Out</option><option value="11">11 - Nov</option><option value="12">12 - Dez</option>
                </select>
            </div>
            <div class="date-col input-group">
                <label style="justify-content:center;"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .89-2 2v14c0 1.11.89 2 2 2h14c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 16H5V8h14v11z"/></svg>Ano</label>
                <select id="yearSelect"></select>
            </div>
        </div>

        <!-- TOGGLES -->
        <div class="toggle-group">
            <div class="toggle-btn active" onclick="setToggle(this, 'cvv')" data-val="000">CVV 000</div>
            <div class="toggle-btn" onclick="setToggle(this, 'cvv')" data-val="0000">CVV 0000</div>
        </div>

        <div class="toggle-group">
            <div class="toggle-btn active" onclick="setToggle(this, 'date')" data-val="YYYY">|MM|YYYY</div>
            <div class="toggle-btn" onclick="setToggle(this, 'date')" data-val="YY">|MM|YY</div>
        </div>

        <!-- QUANTITY -->
        <div class="input-group">
            <label><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Quantidade</label>
            <div class="input-wrapper"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2z"/></svg><input type="number" id="qtyInput" placeholder="Ex: 1000" value="10"></div>
        </div>

        <button class="btn-generate" onclick="generateCards()">GERAR</button>
        
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="status-msg" id="statusMsg"></div>

        <div class="output-box" id="outputBox">
            <button class="copy-btn" onclick="copyText()"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z"/></svg></button>
            <div class="output-content" id="outputContent"></div>
        </div>
    </div>

    <a href="https://wa.me/5585997787846" class="whatsapp-float" target="_blank"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.008-.57-.008-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>

    <script>
        // Init
        const years = document.getElementById('yearSelect');
        const currentYear = new Date().getFullYear();
        for(let y=currentYear; y<=currentYear+10; y++) {
            let opt = document.createElement('option');
            opt.value = y; opt.text = y;
            years.appendChild(opt);
        }

        // Sidebar
        const menu = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        menu.onclick = () => { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); };
        overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); };

        // Toggles
        function setToggle(el, group) {
            el.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        // Luhn Algorithm Logic
        function luhnCheck(num) {
            let sum = 0, alt = false;
            for (let i = num.length - 1; i >= 0; i--) {
                let n = parseInt(num[i], 10);
                if (alt) { n *= 2; if (n > 9) n -= 9; }
                sum += n; alt = !alt;
            }
            return sum % 10 === 0;
        }

        function generateLuhn(bin) {
            // Standard 16 digits: BIN (6-9) + Random + Check Digit
            let number = bin.toString();
            // Fill random until 15 digits
            while (number.length < 15) {
                number += Math.floor(Math.random() * 10);
            }
            // Calculate check digit
            let sum = 0, alt = true;
            for (let i = number.length - 1; i >= 0; i--) {
                let n = parseInt(number[i], 10);
                if (alt) { n *= 2; if (n > 9) n -= 9; }
                sum += n; alt = !alt;
            }
            let checkDigit = (10 - (sum % 10)) % 10;
            return number + checkDigit;
        }

        // Generate Function
        function generateCards() {
            const bin = document.getElementById('binInput').value.replace(/\D/g, '');
            const month = document.getElementById('monthSelect').value;
            const year = document.getElementById('yearSelect').value;
            const qty = parseInt(document.getElementById('qtyInput').value);
            const cvv = document.querySelector('.toggle-group:first-child .active').dataset.val;
            const dateFmt = document.querySelector('.toggle-group:last-child .active').dataset.val;

            // Validation
            const status = document.getElementById('statusMsg');
            if (!bin || bin.length < 6 || bin.length > 9) {
                status.textContent = "BIN inválida (6-9 dígitos)"; status.className = "status-msg error"; return;
            }
            if (!month || !year) {
                status.textContent = "Selecione Mês e Ano"; status.className = "status-msg error"; return;
            }
            if (!qty || qty < 1) {
                status.textContent = "Quantidade inválida"; status.className = "status-msg error"; return;
            }

            // UI Updates
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('progressFill').style.width = '0%';
            status.textContent = "Gerando..."; status.className = "status-msg";
            document.getElementById('outputBox').classList.remove('active');

            // Date String Format
            const dateStr = `|${month}|${dateFmt === 'YY' ? year.slice(2) : year}`;

            // Generation Loop (Fast)
            let results = [];
            const step = Math.max(1, Math.floor(qty / 100)); // Update progress every 1%
            
            for (let i = 0; i < qty; i++) {
                let card = generateLuhn(bin);
                results.push(`${card}${dateStr}|${cvv}`);
                
                if (i % step === 0) {
                    document.getElementById('progressFill').style.width = ((i / qty) * 100) + '%';
                }
            }

            // Finalize
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('outputContent').textContent = results.join('\n');
            document.getElementById('outputBox').classList.add('active');
            status.textContent = `Sucesso! ${results.length} cartões gerados.`; status.className = "status-msg";
        }

        function copyText() {
            const text = document.getElementById('outputContent').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copiado!');
            });
        }
    </script>
</body>
